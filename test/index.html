	       <style>
.new-nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    
    display: flex;
    justify-content: space-around;
    align-items: center;

    background: #000;
    
    padding: 10px 0;

    z-index: 9999;
}

.nav-item {
    text-align: center;
    font-size: 14px;
    color: #555;
}

.nav-item i {
    display: block;
    font-size: 18px;
    margin-bottom: 4px;
}

.nav-item.active {
    color: #007bff;
}

.movie-details p { font-size: 13px; color: #aaa; overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;}
  
  .btn-play {
    display: none !important;
}

/* ১. কন্টেইনার ফিক্স */
#container {
    width: 100%;
    height: 100%;
    position: relative; /* এটি বাটনগুলোর জন্য রেফারেন্স হিসেবে কাজ করবে */
    z-index: 1000005 !important;
}

/* ২. বাটনগুলো প্লেয়ারের উপরে আনার জন্য */
.fullBtn, .fullBtn2, .closeBtn {
    position: absolute !important;
    z-index: 99999999 !important; /* সর্বোচ্চ লেয়ার */
    background: rgba(0, 0, 0, 0.6) !important;
    color: #fff !important;
    border: 1px solid rgba(255, 255, 255, 0.3) !important;
    border-radius: 6px !important;
    padding: 10px 15px !important;
    font-size: 20px !important;
    cursor: pointer !important;
    pointer-events: auto !important; /* ক্লিক নিশ্চিত করা */
}

/* বাটনের পজিশন */
.fullBtn { left: 35px; bottom: 10px; }
.fullBtn2 { right: 10px; bottom: 10px; }
.closeBtn { top: 10px; right: 10px; }

/* বাটনগুলোকে কন্ট্রোল বার থেকে উঁচুতে তোলা */
.fullBtn, .fullBtn2 {
    bottom: 13px !important; /* কন্ট্রোল বারের উপরে তোলা হলো */
}

/* নিশ্চিত করা যে বাটনগুলো যেন কোনো কিছুর নিচে না থাকে */
#container {
    position: relative !important;
    z-index: 1000 !important;
}
/* Plyr কন্ট্রোল যেন বাটনের ওপর না আসে */
.plyr__controls {
    z-index: 100 !important;
}
</style>

<div id='pwa-loading-spinner-container'><div class='pwa-loading-spinner'/></div>
<div id='custom-pwa-bar'><span>Install App for Best Experience</span><button id='pwa-install-trigger-action'>Install</button></div>

<script type='text/javascript'>
//<![CDATA[
let smartDeferredPrompt;
const installBar = document.getElementById('custom-pwa-bar');
const installBtn = document.getElementById('pwa-install-trigger-action');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); smartDeferredPrompt = e;
    if (!(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone)) { installBar.style.display = 'flex'; }
});

if (installBtn) {
    installBtn.addEventListener('click', async () => {
        if (!smartDeferredPrompt) return;
        installBar.style.display = 'none';
        smartDeferredPrompt.prompt();
        smartDeferredPrompt = null;
    });
}

// === HISTORY ROUTER ANTI-TRACE MASK ENGINE ===
document.addEventListener("DOMContentLoaded", function() {
    const loadingSpinnerContainer = document.getElementById('pwa-loading-spinner-container');
    if (loadingSpinnerContainer) { setTimeout(() => { loadingSpinnerContainer.classList.remove('active'); }, 500); }

    const isPWAView = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (isPWAView) {
        if ('mediaSession' in navigator) { navigator.mediaSession.metadata = new MediaMetadata({ title: ' ', artist: ' ', album: ' ', artwork: [] }); }
        
        // Dynamic Replace System (Eti core runtime session state replace korbe)
        window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
    }

    document.addEventListener('play', function() {
        if (isPWAView && 'mediaSession' in navigator) { navigator.mediaSession.metadata = new MediaMetadata({ title: ' ', artist: ' ', album: ' ', artwork: [] }); }
    }, true);

    // Dynamic Navigation Override
    document.addEventListener('click', function(e) {
        const anchor = e.target.closest('a');
        if (anchor && anchor.href && anchor.target !== '_blank') {
            const targetUrl = anchor.href;
            const currentUrl = window.location.href.split('#')[0];
            
            if (targetUrl.startsWith(window.location.origin) && targetUrl !== currentUrl) {
                if (loadingSpinnerContainer) loadingSpinnerContainer.classList.add('active');
                
                // MAIN TRICK: PWA bhetor item context array step-up na kore single stack-e run hobe
                if (isPWAView) {
                    e.preventDefault();
                    window.location.replace(targetUrl); // Standard entry tracking clear mechanism
                }
            }
        }
    });
});
//]]>
</script>
